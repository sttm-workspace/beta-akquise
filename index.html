<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Beta-Akquise</title>
<style>
:root{--bg:rgba(5,8,16,.55);--card:rgba(8,12,22,.74);--text:#f4ecdb;--muted:#b3a98f;--primary:#e8a838;--on-primary:#1a1204;--ok:#3fa66b;--bad:#ef6a5b;--line:rgba(232,168,56,.25);--r:16px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{height:100vh;height:100dvh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(rgba(3,5,10,.30),rgba(3,5,10,.55)),#05070d url(bg.jpg) center/cover no-repeat fixed;color:var(--text);font-size:clamp(16px,1.2vw + 12px,20px);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:calc(10px + var(--sat)) calc(18px + var(--sar)) 10px calc(18px + var(--sal));background:rgba(5,8,16,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header h1{font-size:1.1em;margin:0;flex:1;color:var(--primary);letter-spacing:.04em;white-space:nowrap}
header h1 small{color:var(--muted);font-weight:400;font-size:.75em;letter-spacing:0}
nav{display:flex;gap:6px}
nav button{font:inherit;font-size:.9em;font-weight:600;padding:12px 18px;min-height:48px;border:0;border-radius:12px;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button.active{background:var(--primary);color:var(--on-primary)}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:18px calc(18px + var(--sar)) calc(18px + var(--sab)) calc(18px + var(--sal))}
main>section{max-width:1200px;margin:0 auto}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.full{grid-column:1/-1}
label{display:block;font-weight:600;margin:0 0 6px;font-size:.85em}
input,select,textarea{width:100%;font:inherit;padding:14px;min-height:52px;border:1.5px solid var(--line);border-radius:12px;background:rgba(0,0,0,.35);color:var(--text);color-scheme:dark}
::placeholder{color:#7d7563}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);border-color:transparent}
textarea{min-height:96px;resize:vertical}
.btn{font:inherit;font-weight:700;padding:16px 28px;min-height:52px;border:0;border-radius:14px;background:linear-gradient(135deg,#f3bd55,#d9902a);color:var(--on-primary);cursor:pointer;box-shadow:0 0 18px rgba(232,168,56,.25)}
.btn.sec{background:rgba(0,0,0,.35);color:var(--text);border:1.5px solid var(--line);box-shadow:none}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad);box-shadow:none}
.btn:active{transform:scale(.98)}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:.85em;color:var(--muted)}
.consent input{width:30px;height:30px;min-height:0;flex:none;margin-top:2px;accent-color:var(--primary)}
.stars{display:flex;gap:6px}
.stars button{font-size:2.1em;line-height:1;background:none;border:0;cursor:pointer;color:#4a4332;padding:2px}
.stars button.on{color:var(--primary);text-shadow:0 0 10px rgba(232,168,56,.6)}
.toast{position:fixed;left:50%;bottom:calc(30px + var(--sab));transform:translateX(-50%);background:var(--primary);color:var(--on-primary);padding:14px 24px;border-radius:14px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.stat{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stat div{flex:1;min-width:110px;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--r);padding:14px 20px}
.stat b{display:block;font-size:1.8em;color:var(--primary)}
.stat span{font-size:.75em;color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;min-height:56px}
.row:last-child{border:0}
.row .info{flex:1;min-width:0}
.row .info small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:.7em;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--muted);white-space:nowrap}
.tag.hot{background:rgba(232,168,56,.22);color:#f3bd55}
.tools{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.tools input{flex:1;min-width:200px}
/* Liste im Querformat: zweispaltig */
@media (orientation:landscape) and (min-width:900px){#list{columns:2;column-gap:32px}#list .row{break-inside:avoid}}
/* Hochformat schmal */
@media (max-width:640px){header h1 small{display:none}nav button{padding:10px 12px}}
/* Querformat niedrig (Handy quer) */
@media (orientation:landscape) and (max-height:520px){header{padding-top:calc(6px + var(--sat));padding-bottom:6px}nav button{min-height:42px;padding:8px 14px}.card{padding:16px}}

/* ===== Vorstellung ===== */
#pitch{position:fixed;inset:0;background:linear-gradient(rgba(3,5,10,.25),rgba(3,5,10,.6)),#05070d url(bg.jpg) center/cover no-repeat;color:var(--text);z-index:50;display:none;flex-direction:column;padding:calc(14px + var(--sat)) calc(24px + var(--sar)) calc(14px + var(--sab)) calc(24px + var(--sal))}
#pitch.open{display:flex}
#pitch .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
#pitch .top strong{color:var(--primary);letter-spacing:.06em}
#pitch .top .tb{display:flex;gap:8px}
#pitch .top button{background:rgba(0,0,0,.4);color:var(--text);border:1px solid var(--line);border-radius:99px;padding:10px 18px;min-height:44px;font:inherit;font-size:.85em;font-weight:600;cursor:pointer}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.slide{width:100%;max-width:1200px;max-height:100%;display:grid;gap:clamp(16px,3vw,48px);align-items:center;justify-items:center;text-align:center;animation:in .4s}
@keyframes in{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.slide .media{display:flex;justify-content:center;align-items:center;min-height:0;max-height:100%}
.slide .emoji{font-size:clamp(70px,14vmin,130px);line-height:1}
.slide h2{font-size:clamp(28px,5.2vmin,54px);margin:0 0 .35em;color:var(--primary);text-shadow:0 2px 20px rgba(0,0,0,.6);line-height:1.15}
.slide p{font-size:clamp(18px,3vmin,28px);opacity:.94;margin:0;line-height:1.45}
.slide ul{list-style:none;padding:0;margin:.4em 0 0;text-align:left;font-size:clamp(18px,3vmin,28px);display:inline-block}
.slide li{margin:.55em 0;padding-left:1.4em;position:relative}
.slide li::before{content:"◆";position:absolute;left:0;color:var(--primary);font-size:.7em;top:.2em}
/* Screenshot im Geräterahmen */
.phone{margin:0;border:2px solid rgba(232,168,56,.55);border-radius:28px;padding:8px;background:#05070d;box-shadow:0 0 40px rgba(232,168,56,.18),0 20px 50px rgba(0,0,0,.6)}
.phone img{display:block;border-radius:20px;max-width:100%;width:auto;height:auto}
/* Hochformat: Bild oben, Text unten */
@media (orientation:portrait){
  .slide.has-img{grid-template-rows:minmax(0,1fr) auto}
  .slide.has-img .phone img{max-height:48dvh;max-height:48vh}
}
/* Querformat: Bild links, Text rechts */
@media (orientation:landscape){
  .slide.has-img{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);text-align:left}
  .slide.has-img .phone img{max-height:calc(100dvh - 190px);max-height:calc(100vh - 190px)}
  .slide.has-img ul{display:block}
}
.dots{display:flex;gap:8px;justify-content:center;margin:8px 0 10px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(232,168,56,.3)}
.dots i.on{background:var(--primary)}
.pnav{display:flex;justify-content:space-between;gap:12px}
.pnav button{flex:1;max-width:260px;font:inherit;font-weight:700;padding:16px;min-height:56px;border:0;border-radius:16px;background:linear-gradient(135deg,#f3bd55,#d9902a);color:var(--on-primary);cursor:pointer}
.pnav button.ghost{background:rgba(0,0,0,.4);color:var(--text);border:1px solid var(--line)}
#note{display:none;margin:0 0 10px;padding:12px 16px;border:1px dashed var(--primary);border-radius:12px;background:rgba(0,0,0,.65);font-size:.85em;color:#e9dfc8;line-height:1.5;max-height:28vh;overflow:auto}
#note.show{display:block}
@media (orientation:landscape) and (max-height:520px){.slide h2{font-size:26px}.slide p,.slide ul{font-size:17px}.slide .emoji{font-size:56px}.pnav button{min-height:44px;padding:8px}}
dialog{border:1px solid var(--line);border-radius:var(--r);padding:24px;max-width:520px;width:92%;background:#0b0f1a;color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.7)}
a{color:var(--primary)}
</style>
</head>
<body>
<header>
  <h1 id="appTitle">Rise Beyond <small>Beta-Akquise</small></h1>
  <nav>
    <button data-tab="erfassen" class="active">➕ Erfassen</button>
    <button data-tab="liste">📋 Kontakte</button>
    <button id="startPitch">🎬 Vorstellen</button>
  </nav>
</header>

<main>
  <section id="tab-erfassen">
    <form id="form" class="card">
      <div class="grid">
        <div><label for="name">Name *</label><input id="name" required autocomplete="off" placeholder="Vor- und Nachname"></div>
        <div><label for="email">E-Mail *</label><input id="email" type="email" required autocomplete="off" inputmode="email" placeholder="name@beispiel.de"></div>
        <div><label for="phone">Telefon (optional)</label><input id="phone" type="tel" inputmode="tel" autocomplete="off"></div>
        <div><label for="device">Gerät / Plattform</label>
          <select id="device"><option>iPhone</option><option>Android</option><option>Beides</option><option>Sonstiges</option></select></div>
        <div class="full"><label for="reason">Grund des Interesses</label>
          <textarea id="reason" placeholder="Was hat sie/ihn angesprochen? Welches Problem soll die App lösen?"></textarea></div>
        <div><label for="where">Ort / Anlass</label><input id="where" placeholder="z. B. Stadtpark, Uni-Mensa"></div>
        <div><label>Interesse</label><div class="stars" id="stars"></div></div>
        <div class="full"><label for="notes">Notizen</label><input id="notes" placeholder="Wünsche, Rückfragen, Zeitpunkt zum Nachfassen …"></div>
        <div class="full consent"><input type="checkbox" id="consent" required>
          <label for="consent" style="font-weight:400;margin:0">Die Person hat zugestimmt, dass ich ihre Daten speichere und sie per E-Mail zur Beta-Teilnahme kontaktiere (jederzeit widerrufbar).</label></div>
        <div class="full"><button class="btn" type="submit" style="width:100%">Speichern</button></div>
      </div>
    </form>
  </section>

  <section id="tab-liste" hidden>
    <div class="stat" id="stats"></div>
    <div class="tools">
      <input id="search" type="search" placeholder="🔍 Suchen …">
      <button class="btn sec" id="exportCsv">⬇ CSV exportieren</button>
    </div>
    <div class="card" id="list"></div>
  </section>
</main>

<div id="pitch">
  <div class="top"><strong id="pitchTitle"></strong>
    <div class="tb"><button id="toggleNote">📝 Skript</button><button id="closePitch">✕ Schließen</button></div></div>
  <div id="stage"><div id="slideBox" class="slide"></div></div>
  <div id="note"></div>
  <div class="dots" id="dots"></div>
  <div class="pnav"><button class="ghost" id="prev">← Zurück</button><button id="next">Weiter →</button></div>
</div>

<dialog id="detail"></dialog>
<div class="toast" id="toast"></div>

<script>
/* ================= HIER ANPASSEN =================
   img  = Screenshot in Ordner screenshots/ (fehlt die Datei, wird das Emoji gezeigt)
   note = Sprechertext, nur sichtbar über den Button "📝 Skript"                      */
const CONFIG = {
  appName: "Rise Beyond",
  slides: [
    { emoji:"👋", title:"Hi, ich bin Kevin", text:"Ich baue Rise Beyond und suche 20 Menschen für die Closed Beta, die ehrlich sagen, was funktioniert und was nicht.",
      note:"Lächeln, Blickkontakt. „Hast du 2 Minuten? Ich zeig dir kurz, woran ich arbeite – und ob es für dich passt.“ Nicht mit der App starten, sondern mit der Frage." },
    { emoji:"🤯", title:"Das Problem", text:"Ziele in einer App, Aufgaben in der nächsten, Kalender in der dritten – und trotzdem weißt du nicht, womit du jetzt anfangen sollst.",
      note:"Frage stellen: „Wie planst du deinen Tag gerade? Eine App, mehrere, Zettel?“ Zuhören, Stichwort ins Feld „Grund des Interesses“ merken. Dann erst weiter." },
    { emoji:"🎯", img:"screenshots/01-heute.jpg", title:"Wisse, was jetzt zählt.", text:"Morgens bekommst du ein Briefing: was ansteht, wie viel Fokuszeit frei ist – und eine klare nächste Aktion mit Begründung.",
      note:"Auf den Screenshot zeigen: „Hier siehst du, was heute ansteht und wie viel freie Zeit du hast. Die App schlägt dir vor, womit du anfängst – und sagt dir warum.“" },
    { emoji:"🧭", img:"screenshots/02-ziele.jpg", title:"Ziele, die im Alltag ankommen", list:["Fortschritt pro Ziel auf einen Blick","Der nächste Schritt steht immer dabei","Jede Aufgabe gehört zu einem Ziel"],
      note:"Auf den Screenshot zeigen: „Hier siehst du deine Ziele mit Fortschritt – und bei jedem den nächsten konkreten Schritt. Du weißt immer, woran du arbeitest und warum.“" },
    { emoji:"📅", img:"screenshots/03-woche.jpg", title:"Eine Woche mit klarem Fokus", list:["Wochenfokus: die Dinge, die diese Woche zählen","Verteilt über die Tage – mit Begründung","„Nicht Priorität“ zeigt, was warten darf"],
      note:"Auf den Screenshot zeigen: „Die App schlägt dir einen Wochenfokus vor – die vier Dinge, die wirklich zählen. Und sie sagt dir auch, was warten darf. Das nimmt Druck raus.“" },
    { emoji:"✋", title:"Du entscheidest", list:["Vorschlag annehmen, anpassen oder ablehnen","Kostenlos in der Beta","Keine Tracking-Cookies – Konto jederzeit löschbar"],
      note:"Wichtig für Vertrauen: Die App bevormundet nicht. Datenschutz kurz und ehrlich nennen. Bei Nachfrage: Details auf rise-beyond.xyz/datenschutz." },
    { emoji:"🎟️", title:"So kommst du rein", list:["1. Jetzt kurz eintragen","2. Wir prüfen die Bewerbung","3. Zugangscode per E-Mail","4. Loslegen"],
      note:"Ehrlich sein: Es gibt nur 20 Plätze und eine kurze Prüfung. Das macht die Einladung wertvoller. Erwartung setzen: „Du hörst per E-Mail von uns.“" },
    { emoji:"✍️", title:"Mach mit – nur 20 Plätze", text:"Trag dich kurz ein, du bekommst deinen Zugangscode per E-Mail. rise-beyond.xyz",
      note:"Tablet umdrehen und Formular reichen: „Name, E-Mail, und sag mir gern, was dich anspricht.“ Einwilligungs-Häkchen die Person selbst setzen lassen. Danke sagen, Kontakt speichern." }
  ]
};
/* ================================================= */

const $ = s => document.querySelector(s);
const KEY = "beta_leads_v1";
let leads = [];
try { leads = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(leads)); }catch(e){ alert("Speichern fehlgeschlagen!"); } };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast = m => { const t=$("#toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); };

document.title = CONFIG.appName + " – Beta-Akquise";

document.querySelectorAll("nav [data-tab]").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav [data-tab]").forEach(x => x.classList.toggle("active", x===b));
  ["erfassen","liste"].forEach(t => $("#tab-"+t).hidden = t !== b.dataset.tab);
  if (b.dataset.tab === "liste") render();
});

let stars = 3;
const starBox = $("#stars");
function drawStars(){ starBox.innerHTML = [1,2,3,4,5].map(i=>`<button type="button" data-i="${i}" class="${i<=stars?'on':''}" aria-label="${i} Sterne">★</button>`).join(""); }
starBox.onclick = e => { const b = e.target.closest("button"); if(b){ stars = +b.dataset.i; drawStars(); } };
drawStars();

$("#form").onsubmit = e => {
  e.preventDefault();
  const email = $("#email").value.trim().toLowerCase();
  if (leads.some(l => l.email === email) && !confirm("Diese E-Mail ist schon gespeichert. Trotzdem nochmal anlegen?")) return;
  leads.unshift({
    id: Date.now(), created: new Date().toISOString(),
    name: $("#name").value.trim(), email, phone: $("#phone").value.trim(),
    device: $("#device").value, reason: $("#reason").value.trim(),
    where: $("#where").value.trim(), interest: stars, notes: $("#notes").value.trim(),
    consent: true, invited: false
  });
  save(); e.target.reset(); stars = 3; drawStars(); toast("✓ Gespeichert");
  $("#name").focus();
};

function render(){
  const q = $("#search").value.toLowerCase();
  const shown = leads.filter(l => !q || [l.name,l.email,l.reason,l.where,l.notes].join(" ").toLowerCase().includes(q));
  const today = new Date().toDateString();
  $("#stats").innerHTML =
    `<div><b>${leads.length}</b><span>Gesamt</span></div>
     <div><b>${leads.filter(l=>new Date(l.created).toDateString()===today).length}</b><span>Heute</span></div>
     <div><b>${leads.filter(l=>l.interest>=4).length}</b><span>Heiß (4–5 ★)</span></div>
     <div><b>${leads.filter(l=>l.invited).length}</b><span>Eingeladen</span></div>`;
  $("#list").innerHTML = shown.length ? shown.map(l => `
    <div class="row" data-id="${l.id}">
      <div class="info"><strong>${esc(l.name)}</strong><small>${esc(l.email)} · ${esc(l.reason||"–")}</small></div>
      ${l.invited?'<span class="tag">eingeladen</span>':''}
      <span class="tag ${l.interest>=4?'hot':''}">${"★".repeat(l.interest)}</span>
    </div>`).join("") : '<p style="color:var(--muted);text-align:center">Noch keine Kontakte.</p>';
}
$("#search").oninput = render;
$("#list").onclick = e => { const r=e.target.closest(".row"); if(r) openDetail(+r.dataset.id); };

function openDetail(id){
  const l = leads.find(x=>x.id===id); if(!l) return;
  const d = $("#detail");
  d.innerHTML = `<h2 style="margin-top:0">${esc(l.name)}</h2>
    <p><a href="mailto:${esc(l.email)}">${esc(l.email)}</a>${l.phone?` · ${esc(l.phone)}`:""}</p>
    <p><b>Gerät:</b> ${esc(l.device)}<br><b>Ort:</b> ${esc(l.where||"–")}<br><b>Interesse:</b> ${"★".repeat(l.interest)}<br>
    <b>Grund:</b> ${esc(l.reason||"–")}<br><b>Notizen:</b> ${esc(l.notes||"–")}<br>
    <small style="color:var(--muted)">${new Date(l.created).toLocaleString("de-DE")}</small></p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn sec" id="dInv">${l.invited?"Als nicht eingeladen markieren":"Als eingeladen markieren"}</button>
      <button class="btn danger" id="dDel">Löschen</button>
      <button class="btn" id="dClose">Schließen</button></div>`;
  d.showModal();
  $("#dClose").onclick = () => d.close();
  $("#dInv").onclick = () => { l.invited = !l.invited; save(); d.close(); render(); };
  $("#dDel").onclick = () => { if(confirm("Kontakt wirklich löschen?")){ leads = leads.filter(x=>x.id!==id); save(); d.close(); render(); } };
}

$("#exportCsv").onclick = () => {
  if(!leads.length) return toast("Keine Daten");
  const cols = [["created","Erfasst"],["name","Name"],["email","E-Mail"],["phone","Telefon"],["device","Gerät"],["reason","Grund"],["where","Ort"],["interest","Interesse"],["notes","Notizen"],["invited","Eingeladen"]];
  const cell = v => '"' + String(v ?? "").replace(/"/g,'""') + '"';
  const csv = "﻿" + [cols.map(c=>cell(c[1])).join(";"), ...leads.map(l=>cols.map(c=>cell(l[c[0]])).join(";"))].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = "beta-tester-" + new Date().toISOString().slice(0,10) + ".csv";
  a.click();
};

/* ===== Vorstellung ===== */
let si = 0;
function slide(){
  const s = CONFIG.slides[si];
  const box = $("#slideBox");
  const txt = `<div class="txt"><h2>${esc(s.title)}</h2>` + (s.text?`<p>${esc(s.text)}</p>`:"") + (s.list?`<ul>${s.list.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"") + `</div>`;
  const emoji = `<div class="emoji">${s.emoji}</div>`;
  box.className = "slide" + (s.img ? " has-img" : "");
  box.innerHTML = `<div class="media">${s.img ? `<figure class="phone"><img src="${esc(s.img)}" alt="${esc(s.title)}"></figure>` : emoji}</div>${txt}`;
  const img = box.querySelector("img");
  if (img) img.onerror = () => { box.classList.remove("has-img"); box.querySelector(".media").innerHTML = emoji; };
  $("#note").textContent = s.note || "";
  $("#dots").innerHTML = CONFIG.slides.map((_,i)=>`<i class="${i===si?'on':''}"></i>`).join("");
  $("#prev").style.visibility = si ? "visible":"hidden";
  $("#next").textContent = si === CONFIG.slides.length-1 ? "✍️ Jetzt eintragen" : "Weiter →";
}
function openPitch(){ si=0; $("#pitchTitle").textContent = CONFIG.appName; $("#note").classList.remove("show"); $("#pitch").classList.add("open"); slide(); }
function closePitch(){ $("#pitch").classList.remove("open"); }
$("#startPitch").onclick = openPitch;
$("#closePitch").onclick = closePitch;
$("#toggleNote").onclick = () => $("#note").classList.toggle("show");
$("#prev").onclick = () => { if(si>0){ si--; slide(); } };
$("#next").onclick = () => { if(si<CONFIG.slides.length-1){ si++; slide(); } else { closePitch(); document.querySelector('[data-tab="erfassen"]').click(); $("#name").focus(); } };
// Wischen
let tx=null; const st=$("#stage");
st.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
st.addEventListener("touchend",e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>60) (dx<0?$("#next"):$("#prev")).click(); });
document.addEventListener("keydown", e => { if(!$("#pitch").classList.contains("open")) return; if(e.key==="ArrowRight") $("#next").click(); if(e.key==="ArrowLeft") $("#prev").click(); if(e.key==="Escape") closePitch(); });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
