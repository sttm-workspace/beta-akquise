<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Akquise">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Beta-Akquise</title>
<style>
:root{--card:rgba(8,12,22,.76);--text:#f4ecdb;--muted:#b3a98f;--primary:#e8a838;--on-primary:#1a1204;--bad:#ef6a5b;--line:rgba(232,168,56,.25);--r:16px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{height:100vh;height:100dvh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(rgba(3,5,10,.30),rgba(3,5,10,.55)),#05070d url(bg.jpg) center/cover no-repeat fixed;color:var(--text);font-size:clamp(16px,1.1vw + 12px,19px);display:flex;flex-direction:column;overflow:hidden}

/* Kopfzeile */
header{display:flex;align-items:center;justify-content:center;gap:12px;padding:calc(10px + var(--sat)) calc(20px + var(--sar)) 10px calc(20px + var(--sal));background:rgba(5,8,16,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav{display:flex;gap:4px;width:100%;max-width:560px}
nav button{flex:1}
nav button{font:inherit;font-size:.88em;font-weight:600;padding:12px 20px;min-height:48px;border:0;border-radius:12px;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button.active{background:var(--primary);color:var(--on-primary)}

/* Inhalt: immer mittig, gleiche Breite links/rechts */
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:22px calc(20px + var(--sar)) calc(24px + var(--sab)) calc(20px + var(--sal))}
main>section{width:100%;max-width:980px;margin:0 auto}
h2.sec{font-size:.8em;letter-spacing:.16em;text-transform:uppercase;color:var(--primary);margin:0 0 14px;font-weight:700}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3vw,30px);box-shadow:0 8px 30px rgba(0,0,0,.45)}

/* Formular-Raster: Hochformat 2 Spalten (2x2), Querformat breit 4 Spalten */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.full{grid-column:1/-1}
.span2{grid-column:span 2}
@media (orientation:landscape) and (min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}}
label{display:block;font-weight:600;margin:0 0 7px;font-size:.82em;letter-spacing:.03em;color:var(--muted)}
input,select,textarea{width:100%;font:inherit;padding:14px 16px;min-height:54px;border:1.5px solid var(--line);border-radius:12px;background:rgba(0,0,0,.38);color:var(--text);color-scheme:dark}
::placeholder{color:#7d7563}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);border-color:transparent}
textarea{min-height:104px;resize:vertical}
.btn{font:inherit;font-weight:700;letter-spacing:.04em;padding:16px 28px;min-height:54px;border:0;border-radius:14px;background:linear-gradient(135deg,#f3bd55,#d9902a);color:var(--on-primary);cursor:pointer;box-shadow:0 0 18px rgba(232,168,56,.22)}
.btn.sec{background:rgba(0,0,0,.38);color:var(--text);border:1.5px solid var(--line);box-shadow:none}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad);box-shadow:none}
.btn:active{transform:scale(.98)}
.consent{display:flex;gap:14px;align-items:flex-start;font-size:.85em;color:var(--muted);padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.25)}
.consent input{width:30px;height:30px;min-height:0;flex:none;margin-top:1px;accent-color:var(--primary)}
.consent label{margin:0;font-weight:400;font-size:1em;letter-spacing:0}
.stars{display:flex;gap:4px;min-height:54px;align-items:center}
.stars button{font-size:2.1em;line-height:1;background:none;border:0;cursor:pointer;color:#4a4332;padding:2px 4px}
.stars button.on{color:var(--primary);text-shadow:0 0 10px rgba(232,168,56,.55)}
.toast{position:fixed;left:50%;bottom:calc(30px + var(--sab));transform:translateX(-50%);background:var(--primary);color:var(--on-primary);padding:14px 28px;border-radius:14px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}

/* Kontakte */
.stat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:560px){.stat{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat div{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px}
.stat b{display:block;font-size:1.8em;color:var(--primary);font-weight:600}
.stat span{font-size:.72em;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.row{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;min-height:58px}
.row:last-child{border:0}
.row .info{flex:1;min-width:0}
.row .info small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:.7em;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--muted);white-space:nowrap;letter-spacing:.04em}
.tag.hot{background:rgba(232,168,56,.22);color:#f3bd55}
.tools{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.tools input{flex:1;min-width:200px}
@media (orientation:landscape) and (min-width:900px){#list{columns:2;column-gap:32px}#list .row{break-inside:avoid}}

/* Skript */
.part{margin-bottom:22px}
.part .num{color:var(--primary);font-weight:700;letter-spacing:.14em;font-size:.78em;text-transform:uppercase}
.part h3{margin:4px 0 12px;font-size:1.25em;font-weight:600}
.say{border-left:3px solid var(--primary);padding:4px 0 4px 16px;margin:12px 0;font-size:1.02em;line-height:1.55}
.say b{display:block;font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:var(--primary);margin-bottom:3px}
.hint{color:var(--muted);font-size:.9em;line-height:1.55;margin:10px 0 0}
.tips{margin:8px 0 0;padding:0;list-style:none}
.tips li{position:relative;padding:6px 0 6px 22px;line-height:1.5}
.tips li::before{content:"";position:absolute;left:4px;top:.95em;width:7px;height:7px;background:var(--primary);transform:rotate(45deg)}
.steps{display:grid;gap:18px}
.step{display:grid;gap:18px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.28)}
.step figure{margin:0;justify-self:center}
.step .shot{border:2px solid rgba(232,168,56,.5);border-radius:24px;padding:6px;background:#05070d;cursor:zoom-in;display:block;box-shadow:0 0 30px rgba(232,168,56,.12)}
.step .shot img{display:block;border-radius:18px;width:100%;max-width:230px;height:auto}
.step figcaption{text-align:center;font-size:.72em;color:var(--muted);margin-top:8px;letter-spacing:.08em;text-transform:uppercase}
.step h4{margin:0 0 6px;font-size:1.08em;font-weight:600;color:var(--primary)}
.step .see{color:var(--muted);font-size:.92em;line-height:1.5;margin:0 0 8px}
/* Hochformat: Bild oben, mittig; Querformat: Bild links, Text rechts */
@media (orientation:landscape) and (min-width:760px){.step{grid-template-columns:auto minmax(0,1fr)}}
dl.obj{margin:0}
dl.obj dt{font-weight:600;margin-top:14px}
dl.obj dd{margin:3px 0 0;color:var(--muted);line-height:1.5}
.check{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 20px}
@media (max-width:560px){.check{grid-template-columns:1fr}}
.check label{display:flex;gap:12px;align-items:center;margin:0;font-weight:400;font-size:.95em;color:var(--text);letter-spacing:0;min-height:44px}
.check input{width:24px;height:24px;min-height:0;flex:none;accent-color:var(--primary)}

dialog{border:1px solid var(--line);border-radius:var(--r);padding:24px;max-width:520px;width:92%;background:#0b0f1a;color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.75)}
/* Vollbild-Bild: mittig, Hintergrund fast schwarz, Skript nicht sichtbar */
dialog.zoom{position:fixed;inset:0;margin:0;padding:0;border:0;width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;background:#020306;color:var(--text);overflow:hidden}
dialog.zoom[open]{display:flex;align-items:center;justify-content:center}
dialog.zoom::backdrop{background:#020306}
dialog.zoom img{display:block;max-width:92vw;max-height:94vh;max-height:94dvh;width:auto;height:auto;object-fit:contain;border-radius:22px;border:2px solid rgba(232,168,56,.5);box-shadow:0 0 60px rgba(232,168,56,.12)}
dialog.zoom .zclose{position:absolute;top:calc(14px + var(--sat));right:calc(14px + var(--sar));min-height:44px;padding:10px 18px;border-radius:99px;border:1px solid var(--line);background:rgba(0,0,0,.6);color:var(--muted);font:inherit;font-size:.85em;cursor:pointer}
/* Status-Auswahl */
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (orientation:landscape) and (min-width:900px){.seg{grid-template-columns:repeat(4,minmax(0,1fr))}}
.seg button{font:inherit;text-align:left;padding:12px 14px;min-height:60px;border:1.5px solid var(--line);border-radius:12px;background:rgba(0,0,0,.35);color:var(--text);cursor:pointer;line-height:1.3}
.seg button small{display:block;color:var(--muted);font-size:.74em;margin-top:2px}
.seg button.on{border-color:var(--primary);background:rgba(232,168,56,.16);box-shadow:0 0 0 1px var(--primary) inset}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chips button{font:inherit;font-size:.82em;padding:9px 16px;min-height:44px;border-radius:99px;border:1.5px solid var(--line);background:rgba(0,0,0,.35);color:var(--muted);cursor:pointer}
.chips button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:700}
.tag.st-interessiert{background:rgba(232,168,56,.22);color:#f3bd55}
.tag.st-nachdenken{background:rgba(120,160,255,.2);color:#a9c1ff}
.tag.st-eingeladen{background:rgba(63,166,107,.22);color:#7fd6a2}
.tag.st-kein{background:rgba(255,255,255,.08);color:var(--muted)}
.tag.due{background:rgba(239,106,91,.25);color:#ff9d90}
.tag.sy-ok{background:rgba(63,166,107,.22);color:#7fd6a2}
.tag.sy-wait{background:rgba(120,160,255,.2);color:#a9c1ff}
.tag.sy-bad{background:rgba(239,106,91,.25);color:#ff9d90}
.conn{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:.88em;color:var(--muted)}
.conn b{color:var(--text)}
.connBtn{display:flex;gap:8px}
.connBtn .btn{min-height:44px;padding:8px 16px;font-size:.9em}
.rdel{font:inherit;font-size:.78em;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid rgba(239,106,91,.5);background:transparent;color:var(--bad);cursor:pointer;white-space:nowrap}
@media (max-width:640px){.row{flex-wrap:wrap}.row .info{flex-basis:100%}}
a{color:var(--primary)}
@media (max-width:640px){nav button{padding:10px 12px}}
@media (orientation:landscape) and (max-height:520px){header{padding-top:calc(6px + var(--sat));padding-bottom:6px}nav button{min-height:42px}}
</style>
</head>
<body>
<header>
  <nav>
    <button data-tab="erfassen" class="active">Erfassen</button>
    <button data-tab="liste">Kontakte</button>
    <button data-tab="skript">Skript</button>
  </nav>
</header>

<main>
  <!-- Erfassen -->
  <section id="tab-erfassen">
    <form id="form" class="card">
      <div class="grid">
        <div><label for="name">Name *</label><input id="name" required autocomplete="off" placeholder="Vor- und Nachname"></div>
        <div><label for="email">E-Mail *</label><input id="email" type="email" required autocomplete="off" inputmode="email" placeholder="name@beispiel.de"></div>
        <div><label for="phone">Telefon (optional)</label><input id="phone" type="tel" inputmode="tel" autocomplete="off"></div>
        <div><label for="device">Gerät / Plattform</label>
          <select id="device"><option>iPhone</option><option>Android</option><option>Beides</option><option>Sonstiges</option></select></div>
        <div class="full"><label for="reason">Grund des Interesses</label>
          <textarea id="reason" placeholder="Was hat sie/ihn angesprochen? Welches Problem soll die App lösen?"></textarea></div>
        <div class="span2"><label for="where">Ort / Anlass</label><input id="where" placeholder="z. B. Stadtpark, Uni-Mensa"></div>
        <div class="span2"><label>Interesse</label><div class="stars" id="stars"></div></div>
        <div class="full"><label>Status</label><div class="seg" id="statusSeg"></div></div>
        <div class="full" id="followWrap" hidden><label for="follow">Nachfragen am</label><input id="follow" type="date"></div>
        <div class="full"><label for="notes">Notizen</label><input id="notes" placeholder="Wünsche, Rückfragen, Zeitpunkt zum Nachfassen"></div>
        <div class="full consent"><input type="checkbox" id="consent" required>
          <label for="consent">Die Person hat zugestimmt, dass ich ihre Daten speichere und sie per E-Mail zur Beta-Teilnahme kontaktiere (jederzeit widerrufbar).</label></div>
        <div class="full"><button class="btn" type="submit" style="width:100%">Speichern</button></div>
      </div>
    </form>
  </section>

  <!-- Kontakte -->
  <section id="tab-liste" hidden>
    <div class="conn" id="conn"></div>
    <div class="stat" id="stats"></div>
    <div class="chips" id="chips"></div>
    <div class="tools">
      <input id="search" type="search" placeholder="Suchen">
      <button class="btn sec" id="exportCsv">CSV exportieren</button>
    </div>
    <div class="card" id="list"></div>
  </section>

  <!-- Skript -->
  <section id="tab-skript" hidden></section>
</main>

<dialog id="detail"></dialog>
<dialog id="invite"></dialog>
<dialog id="cfgDlg"></dialog>
<dialog id="zoom" class="zoom"></dialog>
<div class="toast" id="toast"></div>

<script>
/* ================= SKRIPT-INHALT (hier anpassen) =================
   Screenshots liegen in screenshots/. Tippen auf ein Bild zeigt es groß,
   damit du es der Person zeigen kannst.                                 */
const SCRIPT = {
  intro: {
    title: "Ansprechen",
    say: "Hi, ich bin Kevin. Ich baue gerade eine Planungs-App und suche Leute für einen kleinen, geschlossenen Test. Hast du zwei Minuten?",
    tips: ["Tablet noch unten halten, erst Blickkontakt, dann die App.","Bei einem Nein: freundlich verabschieden, nicht nachhaken."]
  },
  question: {
    title: "Frage zum Alltag",
    say: "Wie planst du deinen Tag gerade – mit einer App, mit mehreren, auf Papier?",
    tips: ["Zuhören und das Stichwort der Person merken, später ins Feld „Grund des Interesses“ eintragen.","Typische Antworten: zu viele Apps, Dinge vergessen, unklar womit anfangen. Genau dafür ist die App gedacht."],
    bridge: "Das kenne ich. Genau das soll Rise Beyond lösen: Ziele, Aufgaben und Kalender an einem Ort, und eine klare Antwort auf die Frage, was jetzt zählt. Ich zeig dir kurz, wie das aussieht."
  },
  demo: {
    title: "App zeigen",
    intro: "Maximal drei Bilder, jeweils ein bis zwei Sätze. Zeigt die Person schon nach dem ersten Bild Interesse, direkt zum Abschluss springen.",
    steps: [
      { img:"screenshots/01-heute.png", cap:"Ansicht Heute", head:"Briefing und klare nächste Aktion",
        see:"Das Tagesbriefing fasst zusammen, wie viele Aufgaben anstehen und wie viel freie Zeit bleibt. Darunter zwei starke Optionen mit Begründung und die Aufgabenliste für heute.",
        say:"Morgens bekommst du ein Briefing: was ansteht und wie viel Zeit du hast. Statt einer endlosen Liste schlägt die App zwei sinnvolle Aufgaben vor und erklärt dir warum. Du entscheidest, womit du anfängst." },
      { img:"screenshots/02-ziele.png", cap:"Ansicht Ziele", head:"Ziele mit Fortschritt und nächstem Schritt",
        see:"Jedes Ziel zeigt Fortschritt in Prozent, Zieldatum, erledigte Aufgaben und den nächsten konkreten Schritt.",
        say:"Aufgaben gehören hier immer zu einem Ziel. Du siehst, wie weit du bist und was der nächste Schritt ist. So arbeitest du nicht nur Listen ab, sondern kommst wirklich voran." },
      { img:"screenshots/03-woche.png", cap:"Ansicht Woche", head:"Wochenfokus mit Begründung",
        see:"Die Woche zeigt die Tage, den Wochenfokus mit den entscheidenden Schwerpunkten und den Bereich „Nicht Priorität“ mit kurzer Begründung.",
        say:"Die App schlägt dir einen Wochenfokus vor, also die wenigen Dinge, die diese Woche wirklich zählen. Und sie sagt dir auch, was warten darf. Das nimmt Druck raus." }
    ],
    note: "Hinweis: Die Bilder enthalten ausschließlich Beispieldaten."
  },
  trust: {
    title: "Vertrauen und Ablauf",
    say: "Du entscheidest immer selbst: Vorschläge kannst du annehmen, anpassen oder ablehnen. Die Beta ist kostenlos, wir nutzen keine Tracking-Cookies und du kannst dein Konto jederzeit löschen.",
    flow: ["Jetzt kurz eintragen","Wir prüfen die Bewerbung","Zugangscode per E-Mail","Loslegen"],
    flowSay: "Es gibt nur 20 Plätze. Du trägst dich ein, wir prüfen kurz, und du bekommst deinen Zugangscode per E-Mail."
  },
  close: {
    title: "Abschluss",
    say: "Wenn das für dich passt: Trag dich kurz ein. Den Zugangscode schicke ich dir per E-Mail.",
    tips: ["Tablet reichen, die Person tippt Name und E-Mail selbst, das vermeidet Tippfehler.","Das Einwilligungs-Häkchen setzt die Person selbst. Ohne Häkchen wird nicht gespeichert.","Danach fragen: „Was hat dich am meisten angesprochen?“ und die Antwort bei „Grund des Interesses“ notieren.","Sterne: 1–2 höflich interessiert, 3 neutral, 4–5 begeistert."]
  },
  objections: [
    ["Noch eine App?","Genau das soll sie ersetzen: Ziele, Aufgaben und Kalender an einem Ort statt in fünf Apps."],
    ["Was kostet das?","Die Beta ist kostenlos."],
    ["Was passiert mit meinen Daten?","Keine Tracking-Cookies, das Konto ist jederzeit löschbar. Details unter rise-beyond.xyz/datenschutz."],
    ["Ist die App fertig?","Nein, deshalb die Beta. Dein ehrliches Feedback gestaltet sie mit."],
    ["Gibt es sie für mein Gerät?","Ehrlich antworten, was aktuell gilt. Im Zweifel: „Das klär ich und schreibe dir.“ und in den Notizen vermerken."],
    ["Ich überlege es mir.","Gern. Trag dich trotzdem unverbindlich ein, du bekommst dann nur den Zugangscode."]
  ],
  check: ["Akku voll, Helligkeit hoch, automatische Drehung an","App einmal online geöffnet, Flugmodus-Test gemacht","Hoch- und Querformat kurz geprüft","CSV-Export vom Vortag gesichert"],
  after: ["Am selben Tag Kontakte durchsehen, Interesse 4–5 zuerst einladen: „Eingeladen“ legt die Person im Adminpanel als „Code bereit“ an. Den Zugangscode sendest du dort.","Regelmäßig als CSV exportieren, die Daten liegen nur auf diesem Tablet.","Nur Personen mit Einwilligung kontaktieren, höchstens einmal nachfassen."]
};
/* ================================================================== */

const $ = s => document.querySelector(s);
const KEY = "beta_leads_v1";
let leads = [];
try { leads = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(leads)); }catch(e){ alert("Speichern fehlgeschlagen!"); } };

/* Kategorien für Kontakte */
const STATUS = [
  {k:"interessiert", label:"Interessiert", hint:"Registrierung"},
  {k:"nachdenken",   label:"Denkt nach",   hint:"Nachfrage in ein paar Tagen"},
  {k:"eingeladen",   label:"Eingeladen",   hint:"Im Adminpanel angelegt"},
  {k:"kein",         label:"Kein Interesse", hint:"Nicht mehr kontaktieren"}
];
const stLabel = k => (STATUS.find(s=>s.k===k)||STATUS[0]).label;
const ymd = d => { const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const inDays = n => { const d=new Date(); d.setDate(d.getDate()+n); return ymd(d); };
const fmtDate = s => s ? new Date(s+"T12:00:00").toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"}) : "";
const isDue = l => l.status==="nachdenken" && l.follow && l.follow <= ymd(new Date());
leads.forEach(l => { if(!l.status) l.status = l.invited ? "eingeladen" : "interessiert"; });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast = m => { const t=$("#toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); };

/* ===== Verbindung zum Rise-Beyond-Adminpanel =====
   "Eingeladen" legt die Person als Closed-Beta-Registrierung mit Status "Code bereit" an.
   Es wird keine Mail verschickt und kein Code erzeugt; das passiert weiter im Adminpanel. */
const CFG_KEY = "beta_cfg_v1";
const DEFAULT_API = "https://rise-beyond.xyz/api/akquise/invite";
let cfg = { api: DEFAULT_API, token: "" };
try { cfg = { ...cfg, ...JSON.parse(localStorage.getItem(CFG_KEY) || "{}") }; } catch(e){}
const saveCfg = () => { try{ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }catch(e){} };
const splitName = full => { const p = String(full).replace(/\s+/g," ").trim().split(" ").filter(Boolean);
  return p.length < 2 ? { first: p[0]||"", last: "" } : { first: p.slice(0,-1).join(" "), last: p[p.length-1] }; };
const RESULT_TEXT = { created:"Neu im Adminpanel angelegt", promoted:"Bestehende Bewerbung auf „Code bereit“ gesetzt", exists:"War dort schon bereit", already_sent:"Code wurde dort schon versendet" };
let syncing = false;
async function syncLead(l){
  if (!cfg.token) { l.sync = "pending"; l.syncMsg = "Verbindung noch nicht eingerichtet"; return; }
  try {
    const r = await fetch(cfg.api, { method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer " + cfg.token },
      body: JSON.stringify({ firstName:l.firstName, lastName:l.lastName, email:l.email, reason:l.reason||"", consent:l.consent===true }) });
    let j = {}; try { j = await r.json(); } catch(e){}
    if (r.ok) { l.sync = "synced"; l.syncMsg = RESULT_TEXT[j.result] || "Übertragen"; l.syncedAt = new Date().toISOString(); }
    else if (r.status === 409) { l.sync = "blocked"; l.syncMsg = "Bewerbung wurde abgelehnt, bitte im Adminpanel prüfen"; }
    else if (r.status === 401) { l.sync = "error"; l.syncMsg = "Token wird nicht akzeptiert"; }
    else if (r.status === 503 || r.status === 404) { l.sync = "error"; l.syncMsg = "Schnittstelle auf dem Server noch nicht eingerichtet"; }
    else { l.sync = "error"; l.syncMsg = j.message || ("Fehler " + r.status); }
  } catch(e) { l.sync = "pending"; l.syncMsg = "Kein Netz, wird später gesendet"; }
}
const needsSync = l => l.status === "eingeladen" && l.firstName && l.lastName && l.sync !== "synced" && l.sync !== "blocked";
async function syncAll(manual){
  if (syncing) return; syncing = true;
  try {
    const todo = leads.filter(needsSync);
    for (const l of todo) await syncLead(l);
    save(); render();
    if (manual) toast(todo.length ? "Übertragung abgeschlossen" : "Nichts zu senden");
  } finally { syncing = false; }
}
window.addEventListener("online", () => syncAll(false));

/* Dialog: Vor-/Nachname bestätigen, bevor jemand im Adminpanel angelegt wird */
function askInvite(l, ok, cancel){
  const d = $("#invite"), n = splitName(l.name); let done = false;
  d.innerHTML = `<h2 style="margin-top:0">Im Adminpanel anlegen</h2>
    <p class="hint" style="margin-top:0">${esc(l.name)} wird bei Rise Beyond als Closed-Beta-Registrierung mit Status „Code bereit“ angelegt. Es wird keine E-Mail verschickt. Den Zugangscode sendest du anschließend im Adminpanel.</p>
    <div class="grid" style="margin:16px 0">
      <div><label for="iF">Vorname</label><input id="iF" value="${esc(l.firstName||n.first)}"></div>
      <div><label for="iL">Nachname</label><input id="iL" value="${esc(l.lastName||n.last)}"></div>
      <div class="full"><label>E-Mail</label><input value="${esc(l.email)}" readonly></div></div>
    <p id="iErr" class="hint" style="color:var(--bad);margin:0 0 12px" hidden></p>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn sec" id="iNo" type="button">Abbrechen</button><button class="btn" id="iYes" type="button">Anlegen</button></div>`;
  d.showModal();
  $("#iNo").onclick = () => d.close();
  $("#iYes").onclick = () => {
    const f = $("#iF").value.trim(), la = $("#iL").value.trim();
    if (!f || !la) { const e = $("#iErr"); e.textContent = "Bitte Vor- und Nachnamen eintragen."; e.hidden = false; return; }
    l.firstName = f; l.lastName = la; done = true; d.close(); ok();
  };
  d.onclose = () => { if (!done && cancel) cancel(); };
}

/* Dialog: Verbindung einrichten */
function openCfg(){
  const d = $("#cfgDlg");
  d.innerHTML = `<h2 style="margin-top:0">Verbindung zum Adminpanel</h2>
    <p class="hint" style="margin-top:0">Der Zugangsschlüssel liegt nur auf diesem Gerät. Du bekommst ihn von mir bzw. aus der Server-Einstellung <b>AKQUISE_API_TOKEN</b>. Bildschirmsperre auf dem Tablet aktiv lassen.</p>
    <div class="grid" style="margin:16px 0;grid-template-columns:1fr">
      <div><label for="cApi">Adresse</label><input id="cApi" value="${esc(cfg.api)}" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <div><label for="cTok">Zugangsschlüssel</label><input id="cTok" type="password" value="${esc(cfg.token)}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="mindestens 32 Zeichen"></div></div>
    <p id="cMsg" class="hint" style="margin:0 0 12px" hidden></p>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn sec" id="cTest" type="button">Testen</button><button class="btn" id="cSave" type="button">Speichern</button><button class="btn sec" id="cClose" type="button">Schließen</button></div>`;
  d.showModal();
  const msg = (t, bad) => { const m = $("#cMsg"); m.textContent = t; m.style.color = bad ? "var(--bad)" : "var(--primary)"; m.hidden = false; };
  const read = () => ({ api: $("#cApi").value.trim() || DEFAULT_API, token: $("#cTok").value.trim() });
  $("#cClose").onclick = () => d.close();
  $("#cSave").onclick = () => { cfg = read(); saveCfg(); d.close(); render(); syncAll(false); toast("Gespeichert"); };
  $("#cTest").onclick = async () => {
    const c = read(); if (!c.token) return msg("Bitte Zugangsschlüssel eintragen.", true);
    msg("Teste …");
    try {
      // Leere Anfrage: bei gültigem Schlüssel antwortet der Server mit 400 (Einwilligung fehlt), es wird nichts angelegt.
      const r = await fetch(c.api, { method:"POST", headers:{ "Content-Type":"application/json", "Authorization":"Bearer " + c.token }, body: "{}" });
      if (r.status === 400) msg("Verbindung in Ordnung.");
      else if (r.status === 401) msg("Der Zugangsschlüssel wird nicht akzeptiert.", true);
      else if (r.status === 503 || r.status === 404) msg("Die Schnittstelle ist auf dem Server noch nicht eingerichtet.", true);
      else msg("Unerwartete Antwort: " + r.status, true);
    } catch(e) { msg("Keine Verbindung (Netz oder Adresse prüfen).", true); }
  };
}

/* Tabs */
const TABS = ["erfassen","liste","skript"];
document.querySelectorAll("nav [data-tab]").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav [data-tab]").forEach(x => x.classList.toggle("active", x===b));
  TABS.forEach(t => $("#tab-"+t).hidden = t !== b.dataset.tab);
  $("main").scrollTop = 0;
  if (b.dataset.tab === "liste") render();
});
const goTab = t => document.querySelector(`[data-tab="${t}"]`).click();

/* Sterne */
let stars = 3;
const starBox = $("#stars");
function drawStars(){ starBox.innerHTML = [1,2,3,4,5].map(i=>`<button type="button" data-i="${i}" class="${i<=stars?'on':''}" aria-label="${i} Sterne">★</button>`).join(""); }
starBox.onclick = e => { const b = e.target.closest("button"); if(b){ stars = +b.dataset.i; drawStars(); } };
drawStars();

/* Status im Formular */
let status = "interessiert";
function drawStatus(){
  $("#statusSeg").innerHTML = STATUS.map(s=>`<button type="button" data-k="${s.k}" class="${s.k===status?'on':''}">${esc(s.label)}<small>${esc(s.hint)}</small></button>`).join("");
  $("#followWrap").hidden = status !== "nachdenken";
  if (status === "nachdenken" && !$("#follow").value) $("#follow").value = inDays(3);
}
$("#statusSeg").onclick = e => { const b=e.target.closest("button"); if(b){ status=b.dataset.k; drawStatus(); } };
drawStatus();

/* Speichern */
$("#form").onsubmit = e => {
  e.preventDefault();
  const email = $("#email").value.trim().toLowerCase();
  if (leads.some(l => l.email === email) && !confirm("Diese E-Mail ist schon gespeichert. Trotzdem nochmal anlegen?")) return;
  const form = e.target;
  const lead = {
    id: Date.now(), created: new Date().toISOString(),
    name: $("#name").value.trim(), email, phone: $("#phone").value.trim(),
    device: $("#device").value, reason: $("#reason").value.trim(),
    where: $("#where").value.trim(), interest: stars, notes: $("#notes").value.trim(),
    consent: true, status, follow: status==="nachdenken" ? ($("#follow").value || inDays(3)) : "", invited: status==="eingeladen", sync: "none"
  };
  const finish = () => {
    leads.unshift(lead); save(); form.reset(); stars = 3; drawStars(); status = "interessiert"; drawStatus(); toast("Gespeichert");
    $("#name").focus();
    if (lead.status === "eingeladen") { lead.sync = "pending"; syncAll(false); }
  };
  // "Eingeladen" erst nach Bestätigung von Vor-/Nachname speichern; bei Abbruch bleibt das Formular unverändert.
  if (status === "eingeladen") askInvite(lead, finish, () => {}); else finish();
};

/* Kontakte */
let filter = "alle";
function render(){
  const q = $("#search").value.toLowerCase();
  const shown = leads.filter(l => (filter==="alle" || (filter==="faellig" ? isDue(l) : l.status===filter)) &&
    (!q || [l.name,l.email,l.reason,l.where,l.notes].join(" ").toLowerCase().includes(q)));
  const today = new Date().toDateString();
  const due = leads.filter(isDue).length;
  $("#stats").innerHTML =
    `<div><b>${leads.length}</b><span>Gesamt</span></div>
     <div><b>${leads.filter(l=>new Date(l.created).toDateString()===today).length}</b><span>Heute</span></div>
     <div><b>${leads.filter(l=>l.status==="interessiert").length}</b><span>Interessiert</span></div>
     <div><b>${due}</b><span>Nachfragen fällig</span></div>`;
  const waiting = leads.filter(needsSync).length, errs = leads.filter(l=>l.status==="eingeladen"&&(l.sync==="error"||l.sync==="blocked")).length;
  $("#conn").innerHTML = `<div class="connTxt"><b>Adminpanel</b> ${cfg.token ? "verbunden" : "nicht eingerichtet"}${waiting?` · ${waiting} warten auf Übertragung`:""}${errs?` · ${errs} mit Fehler`:""}</div>
    <div class="connBtn">${waiting && cfg.token ? '<button type="button" class="btn sec" id="cSync">Jetzt senden</button>' : ""}<button type="button" class="btn sec" id="cOpen">${cfg.token ? "Verbindung" : "Einrichten"}</button></div>`;
  $("#cOpen").onclick = openCfg; if ($("#cSync")) $("#cSync").onclick = () => syncAll(true);
  const chip = (k,t,n) => `<button data-f="${k}" class="${filter===k?'on':''}">${esc(t)} (${n})</button>`;
  $("#chips").innerHTML = chip("alle","Alle",leads.length) +
    STATUS.map(s=>chip(s.k,s.label,leads.filter(l=>l.status===s.k).length)).join("") +
    (due ? chip("faellig","Fällig",due) : "");
  $("#list").innerHTML = shown.length ? shown.map(l => `
    <div class="row" data-id="${l.id}">
      <div class="info"><strong>${esc(l.name)}</strong><small>${esc(l.email)} · ${esc(l.reason||"–")}</small></div>
      <span class="tag st-${l.status} ${isDue(l)?'due':''}">${esc(stLabel(l.status))}${l.status==="nachdenken"&&l.follow?` · ${fmtDate(l.follow)}`:""}</span>
      ${l.status==="eingeladen" ? `<span class="tag sy-${l.sync==="synced"?"ok":(l.sync==="error"||l.sync==="blocked")?"bad":"wait"}" title="${esc(l.syncMsg||"")}">${l.sync==="synced"?"im Adminpanel":(l.sync==="error"||l.sync==="blocked")?"Fehler":"wartet"}</span>` : ""}
      <span class="tag ${l.interest>=4?'hot':''}">${"★".repeat(l.interest)}</span>
      <button type="button" class="rdel" data-del="${l.id}" aria-label="${esc(l.name)} löschen">Löschen</button>
    </div>`).join("") : '<p style="color:var(--muted);text-align:center;margin:8px 0">Keine Kontakte in dieser Ansicht.</p>';
}
$("#chips").onclick = e => { const b=e.target.closest("button"); if(b){ filter=b.dataset.f; render(); } };
$("#search").oninput = render;
$("#list").onclick = e => {
  const del = e.target.closest("[data-del]");
  if (del) {
    const id = +del.dataset.del, l = leads.find(x=>x.id===id);
    if (l && confirm(`„${l.name}“ wirklich löschen?` + (l.sync==="synced" ? "\n\nIm Adminpanel bleibt der Eintrag bestehen." : ""))) { leads = leads.filter(x=>x.id!==id); save(); render(); toast("Gelöscht"); }
    return;
  }
  const r=e.target.closest(".row"); if(r) openDetail(+r.dataset.id);
};

function openDetail(id){
  const l = leads.find(x=>x.id===id); if(!l) return;
  const d = $("#detail");
  d.innerHTML = `<h2 style="margin-top:0">${esc(l.name)}</h2>
    <p><a href="mailto:${esc(l.email)}">${esc(l.email)}</a>${l.phone?` · ${esc(l.phone)}`:""}</p>
    <p><b>Gerät:</b> ${esc(l.device)}<br><b>Ort:</b> ${esc(l.where||"–")}<br><b>Interesse:</b> ${"★".repeat(l.interest)}<br>
    <b>Grund:</b> ${esc(l.reason||"–")}<br><b>Notizen:</b> ${esc(l.notes||"–")}<br>
    <small style="color:var(--muted)">${new Date(l.created).toLocaleString("de-DE")}</small></p>
    <label for="dSt">Status</label>
    <select id="dSt">${STATUS.map(s=>`<option value="${s.k}" ${s.k===l.status?"selected":""}>${esc(s.label)} – ${esc(s.hint||"keine weitere Aktion")}</option>`).join("")}</select>
    <div id="dFollowWrap" style="margin-top:12px" ${l.status==="nachdenken"?"":"hidden"}><label for="dFollow">Nachfragen am</label><input id="dFollow" type="date" value="${esc(l.follow||"")}"></div>
    ${l.status==="eingeladen" ? `<p class="hint" id="dSync"><b>Adminpanel:</b> ${esc(l.sync==="synced" ? (l.syncMsg||"Übertragen") : l.sync==="blocked" ? l.syncMsg : l.firstName ? (l.syncMsg||"Noch nicht übertragen") : "Noch nicht im Adminpanel angelegt")}</p>` : ""}
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px">
      ${l.status==="eingeladen" && !l.firstName ? '<button class="btn sec" id="dAdd" type="button">Im Adminpanel anlegen</button>' : ""}
      ${needsSync(l) && cfg.token ? '<button class="btn sec" id="dSend" type="button">Jetzt senden</button>' : ""}
      <button class="btn danger" id="dDel">Löschen</button>
      <button class="btn" id="dClose">Fertig</button></div>`;
  d.showModal();
  const apply = next => { l.status = next; l.invited = next==="eingeladen";
    l.follow = next==="nachdenken" ? ($("#dFollow").value || l.follow || inDays(3)) : "";
    save(); render(); };
  const upd = () => {
    const prev = l.status, next = $("#dSt").value;
    if (next === "eingeladen" && prev !== "eingeladen" && l.sync !== "synced") {
      askInvite(l, () => { apply(next); l.sync = "pending"; save(); d.close(); syncAll(false); }, () => { $("#dSt").value = prev; });
      return;
    }
    if (prev === "eingeladen" && next !== "eingeladen" && l.sync === "synced" &&
        !confirm("Die Person ist bereits im Adminpanel angelegt und bleibt dort bestehen. Status nur hier ändern?")) { $("#dSt").value = prev; return; }
    apply(next);
    $("#dFollowWrap").hidden = next !== "nachdenken"; if (next==="nachdenken" && !$("#dFollow").value) { $("#dFollow").value = l.follow; }
  };
  $("#dSt").onchange = upd; $("#dFollow").onchange = () => { l.follow = $("#dFollow").value; save(); render(); };
  if ($("#dAdd")) $("#dAdd").onclick = () => askInvite(l, () => { l.sync = "pending"; save(); d.close(); syncAll(false); }, () => {});
  if ($("#dSend")) $("#dSend").onclick = async () => { await syncLead(l); save(); render(); d.close(); openDetail(id); };
  $("#dClose").onclick = () => d.close();
  $("#dDel").onclick = () => { if(confirm("Kontakt wirklich löschen?" + (l.sync==="synced" ? "\n\nIm Adminpanel bleibt der Eintrag bestehen." : ""))){ leads = leads.filter(x=>x.id!==id); save(); d.close(); render(); } };
}

$("#exportCsv").onclick = () => {
  if(!leads.length) return toast("Keine Daten");
  const cols = [["created","Erfasst"],["name","Name"],["email","E-Mail"],["phone","Telefon"],["device","Gerät"],["reason","Grund"],["where","Ort"],["interest","Interesse"],["notes","Notizen"],["status","Status"],["follow","Nachfragen am"],["sync","Adminpanel"]];
  const cell = v => '"' + String(v ?? "").replace(/"/g,'""') + '"';
  const csv = "﻿" + [cols.map(c=>cell(c[1])).join(";"), ...leads.map(l=>cols.map(c=>cell(l[c[0]])).join(";"))].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = "beta-tester-" + new Date().toISOString().slice(0,10) + ".csv";
  a.click();
};

/* Skript */
function buildScript(){
  const S = SCRIPT, say = (t,l="Du sagst") => `<div class="say"><b>${l}</b>${esc(t)}</div>`;
  const tips = a => `<ul class="tips">${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  const part = (n,title,body) => `<div class="card part"><div class="num">Schritt ${n}</div><h3>${esc(title)}</h3>${body}</div>`;
  $("#tab-skript").innerHTML =
    `<h2 class="sec">Gesprächsskript</h2>` +
    part(1,S.intro.title, say(S.intro.say)+tips(S.intro.tips)) +
    part(2,S.question.title, say(S.question.say,"Du fragst")+tips(S.question.tips)+say(S.question.bridge,"Überleitung")) +
    part(3,S.demo.title, `<p class="hint" style="margin-top:0">${esc(S.demo.intro)}</p><div class="steps" style="margin-top:14px">` +
      S.demo.steps.map(s=>`<div class="step"><figure><button type="button" class="shot" data-zoom="${esc(s.img)}" aria-label="${esc(s.cap)} vergrößern"><img src="${esc(s.img)}" alt="${esc(s.cap)}"></button><figcaption>${esc(s.cap)}</figcaption></figure>
        <div><h4>${esc(s.head)}</h4><p class="see"><b>Zu sehen:</b> ${esc(s.see)}</p>${say(s.say)}</div></div>`).join("") +
      `</div><p class="hint">${esc(S.demo.note)}</p>`) +
    part(4,S.trust.title, say(S.trust.say)+`<p class="hint" style="margin-bottom:0"><b>Ablauf:</b> ${S.trust.flow.map((f,i)=>`${i+1}. ${esc(f)}`).join(" &nbsp;→&nbsp; ")}</p>`+say(S.trust.flowSay)) +
    part(5,S.close.title, say(S.close.say)+tips(S.close.tips)+`<div style="margin-top:16px"><button class="btn" id="toForm">Zum Formular</button></div>`) +
    `<div class="card part"><div class="num">Einwände</div><h3>Typische Fragen und Antworten</h3><dl class="obj">${S.objections.map(o=>`<dt>${esc(o[0])}</dt><dd>${esc(o[1])}</dd>`).join("")}</dl></div>` +
    `<div class="card part"><div class="num">Vorher</div><h3>Check vor dem Rausgehen</h3><div class="check">${S.check.map(c=>`<label><input type="checkbox">${esc(c)}</label>`).join("")}</div></div>` +
    `<div class="card part"><div class="num">Nachher</div><h3>Nach dem Gespräch</h3>${tips(S.after)}</div>`;
  $("#toForm").onclick = () => { goTab("erfassen"); $("#name").focus(); };
}
buildScript();

/* Screenshot groß zeigen */

  const b = e.target.closest("[data-zoom]"); if(!b) return;
  const z = $("#zoom"); z.innerHTML = `<img src="${esc(b.dataset.zoom)}" alt=""><button type="button" class="zclose">Schließen</button>`; z.showModal();
});
$("#zoom").addEventListener("click", () => $("#zoom").close());

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
if (navigator.onLine && leads.some(needsSync) && cfg.token) syncAll(false);
</script>
